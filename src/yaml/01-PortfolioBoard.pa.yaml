# scrPortfolioBoard — complete screen.
#
# PASTE: create the three screens first (scrPortfolioBoard / scrPortfolioList /
# scrPursuitWorkspace) and set App.Formulas + App.OnStart, then right-click
# scrPortfolioBoard in the tree view -> Paste. Set the screen's Fill to =ClrPage.
#
# Laid out for Tablet (1366 x 768) with "Scale to fit" OFF.
#
# If Studio rejects the paste, it is almost always one of two controls: see the
# FALLBACKS note at the foot of this file. Nothing else here is exotic.

# CONTROL TYPES: buttons and inputs use the Classic/ prefix -- the unprefixed names
# resolve to the modern Fluent controls, which have no Fill, Color or Radius properties.
# Rounded shapes are Classic/Button with Text "" rather than Rectangle: the classic
# Rectangle has no Radius properties at all, and Button is the only classic control that
# does. Square shapes (rules, dividers, accent bars, the panel scrim) stay Rectangle.

# ---------------------------------------------------------------- nav bar
- navBg:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =64
      Fill: =ClrNav

- navRule:
    Control: Rectangle
    Properties:
      X: =0
      Y: =63
      Width: =Parent.Width
      Height: =1
      Fill: =ClrBorder

- navBrand:
    Control: Label
    Properties:
      X: =GapPage
      Y: =0
      Width: =180
      Height: =64
      Text: ="Pursuit Tracker"
      Font: =FontUI
      Size: =14
      FontWeight: =FontWeight.Semibold
      Color: =ClrText
      VerticalAlign: =VerticalAlign.Middle

- btnNavBoard:
    Control: Classic/Button
    Properties:
      X: =210
      Y: =14
      Width: =170
      Height: =36
      Text: ="Portfolio board"
      Font: =FontUI
      Size: =12
      Fill: =ClrAccent
      Color: =ClrAccentText
      HoverFill: =ClrAccentHover
      HoverColor: =ClrAccentText
      PressedFill: =ClrAccentHover
      PressedColor: =ClrAccentText
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: =false

- btnNavList:
    Control: Classic/Button
    Properties:
      X: =390
      Y: =14
      Width: =160
      Height: =36
      Text: ="Portfolio list"
      Font: =FontUI
      Size: =12
      Fill: =ClrNav
      Color: =ClrTextMuted
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: =Navigate(scrPortfolioList, ScreenTransition.None)

- btnNavWorkspace:
    Control: Classic/Button
    Properties:
      X: =560
      Y: =14
      Width: =190
      Height: =36
      Text: ="Pursuit workspace"
      Font: =FontUI
      Size: =12
      Fill: =ClrNav
      Color: =ClrTextMuted
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      DisplayMode: =If(IsBlank(gblPursuitKey), DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: =Navigate(scrPursuitWorkspace, ScreenTransition.None)

# ---------------------------------------------------------------- page header
- lblPageTitle:
    Control: Label
    Properties:
      X: =GapPage
      Y: =88
      Width: =700
      Height: =36
      Text: ="SI pursuit management"
      Font: =FontUI
      Size: =SizePageTitle
      FontWeight: =FontWeight.Semibold
      Color: =ClrText

- lblPageSub:
    Control: Label
    Properties:
      X: =GapPage
      Y: =126
      Width: =900
      Height: =24
      Text: |
        =If(
            IsBlank(gblMoving),
            "Select the move handle on a pursuit, then choose its new stage.",
            "Moving " & gblMoving.'Pursuit Name' & " — choose a stage, or press the handle again to cancel."
        )
      Font: =FontUI
      Size: =SizeBody
      Color: =If(IsBlank(gblMoving), ClrTextMuted, ClrAccent)

- btnNewPursuit:
    Control: Classic/Button
    Properties:
      X: =Parent.Width - Self.Width - GapPage
      Y: =96
      Width: =150
      Height: =40
      Text: ="Add pursuit"
      Font: =FontUI
      Size: =12
      Fill: =ClrAccent
      Color: =ClrAccentText
      HoverFill: =ClrAccentHover
      HoverColor: =ClrAccentText
      PressedFill: =ClrAccentHover
      PressedColor: =ClrAccentText
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: =Set(gblPursuitKey, Blank()); Set(gblNewPursuit, true); Navigate(scrPursuitWorkspace, ScreenTransition.None)

# ---------------------------------------------------------------- the board
- galStages:
    Control: Gallery
    Variant: Horizontal
    Properties:
      X: =GapPage
      Y: =170
      Width: =Parent.Width - (GapPage * 2)
      Height: =Parent.Height - 170 - GapPage
      Items: =colStages
      TemplateSize: =BoardColWidth
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - colBg:
          Control: Classic/Button
          Properties:
            Text: =""
            Fill: =ClrColumn
            HoverFill: =ClrColumn
            PressedFill: =ClrColumn
            OnSelect: =false
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth - 12
            Height: =Parent.Height - 8
            BorderColor: =ClrBorder
            BorderThickness: =1
            RadiusTopLeft: =RadiusCard
            RadiusTopRight: =RadiusCard
            RadiusBottomLeft: =RadiusCard
            RadiusBottomRight: =RadiusCard

      - recStageAccent:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =colBg.Width
            Height: =3
            Fill: =StageAccent(ThisItem.Stage)

      - lblStageName:
          Control: Label
          Properties:
            X: =16
            Y: =14
            Width: =230
            Height: =24
            Text: =ThisItem.Stage
            Font: =FontUI
            Size: =SizeBody
            FontWeight: =FontWeight.Semibold
            Color: =ClrText
            VerticalAlign: =VerticalAlign.Middle

      - lblStageCount:
          Control: Label
          Properties:
            X: =252
            Y: =14
            Width: =40
            Height: =24
            Text: =CountRows(Filter(colPortfolio, 'Workflow Stage'.Value = ThisItem.Stage))
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrTextMuted
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle

      - recDropTarget:
          Control: Rectangle
          Properties:
            X: =14
            Y: =48
            Width: =280
            Height: =44
            Visible: =Not(IsBlank(gblMoving)) && gblMoving.'Workflow Stage'.Value <> ThisItem.Stage
            Fill: =ColorFade(ClrAccent, 0.75)
            BorderColor: =ClrAccent
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =1
            OnSelect: |
              =Patch(
                  'pursuit-tracker-pursuits',
                  LookUp('pursuit-tracker-pursuits', Title = gblMoving.Title),
                  { 'Workflow Stage': { Value: ThisItem.Stage } }
              );
              Set(gblMoving, Blank());
              ClearCollect(
                  colPortfolio,
                  AddColumns(
                      'pursuit-tracker-pursuits' As P,
                      OwnerName,
                      Coalesce(LookUp(colPeople, Email = P.'WM Pursuit Owner Entra ID').Name, P.'WM Pursuit Owner Entra ID'),
                      NextActionTitle,
                      First(Sort(Filter(colActions, 'Pursuit ID' = P.Title, Status.Value <> "Completed", Not(IsBlank('Due Date'))), 'Due Date', SortOrder.Ascending)).'Action Title',
                      NextActionDue,
                      First(Sort(Filter(colActions, 'Pursuit ID' = P.Title, Status.Value <> "Completed", Not(IsBlank('Due Date'))), 'Due Date', SortOrder.Ascending)).'Due Date',
                      SIsText,  Concat(P.'Aligned SIs', Value, ", "),
                      HypeText, Concat(P.Hyperscalers, Value, ", ")
                  )
              );
              Notify("Moved to " & ThisItem.Stage, NotificationType.Success, 2000)

      - lblDropHint:
          Control: Label
          Properties:
            X: =14
            Y: =48
            Width: =280
            Height: =44
            Visible: =recDropTarget.Visible
            Text: ="Move here"
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrAccent
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - galCards:
          Control: Gallery
          Variant: Vertical
          Properties:
            X: =14
            Y: =If(recDropTarget.Visible, 100, 52)
            Width: =288
            Height: =Parent.Height - Self.Y - 24
            Items: |
              =Sort(
                  Filter(colPortfolio, 'Workflow Stage'.Value = ThisItem.Stage),
                  If(IsBlank('Target Decision Date'), Date(2099, 12, 31), 'Target Decision Date'),
                  SortOrder.Ascending
              )
            TemplateSize: =218
            TemplatePadding: =6
            ShowScrollbar: =true
          Children:
            - recCard:
                Control: Classic/Button
                Properties:
                  Text: =""
                  Fill: =ClrCard
                  HoverFill: =ClrCardHover
                  PressedFill: =ClrCardHover
                  X: =0
                  Y: =0
                  Width: =282
                  Height: =206
                  BorderColor: =If(gblMoving.Title = ThisItem.Title, ClrAccent, ClrBorder)
                  BorderThickness: =If(gblMoving.Title = ThisItem.Title, 2, 1)
                  RadiusTopLeft: =RadiusCard
                  RadiusTopRight: =RadiusCard
                  RadiusBottomLeft: =RadiusCard
                  RadiusBottomRight: =RadiusCard
                  OnSelect: =Set(gblPursuitKey, ThisItem.Title); Set(gblNewPursuit, false); Navigate(scrPursuitWorkspace, ScreenTransition.None)

            - recHealth:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =3
                  Height: =206
                  Fill: =If(ThisItem.Health.Value = "At risk", ClrRiskFill, Color.Transparent)

            - lblMoveHandle:
                Control: Label
                Properties:
                  X: =246
                  Y: =8
                  Width: =28
                  Height: =28
                  Text: ="⋮⋮"
                  Font: =FontUI
                  Size: =12
                  Color: =If(gblMoving.Title = ThisItem.Title, ClrAccent, ClrTextFaint)
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Tooltip: ="Move to another stage"
                  OnSelect: =Set(gblMoving, If(gblMoving.Title = ThisItem.Title, Blank(), ThisItem))

            - lblCardAccount:
                Control: Label
                Properties:
                  X: =14
                  Y: =8
                  Width: =228
                  Height: =24
                  Text: =Clip(ThisItem.'Account Name', 26)
                  Font: =FontUI
                  Size: =SizeCardTitle
                  FontWeight: =FontWeight.Semibold
                  Color: =ClrText
                  VerticalAlign: =VerticalAlign.Middle

            - lblCardTitle:
                Control: Label
                Properties:
                  X: =14
                  Y: =32
                  Width: =254
                  Height: =36
                  # The account is already on its own line above, and every pursuit name
                  # repeats it as an ALL-CAPS prefix ("FRAZIER: MatixCare AWS Platform").
                  # Strip that prefix rather than title-casing the whole string -- Proper()
                  # would turn "AWS" into "Aws" and "CD&R" into "Cd&R". Two separators are
                  # in use: "ACCOUNT: name" and "ACCOUNT - name".
                  Text: |
                    =Clip(
                        With(
                            { n: ThisItem.'Pursuit Name' },
                            Trim(
                                If(
                                    !IsBlank(Find(": ", n)),  Mid(n, Find(": ", n) + 2),
                                    !IsBlank(Find(" - ", n)), Mid(n, Find(" - ", n) + 3),
                                    n
                                )
                            )
                        ),
                        72
                    )
                  Font: =FontUI
                  Size: =SizeBody
                  Color: =ClrText
                  Wrap: =true
                  VerticalAlign: =VerticalAlign.Top

            - lblSICap:
                Control: Label
                Properties:
                  X: =14
                  Y: =70
                  Width: =28
                  Height: =24
                  Text: ="SI:"
                  Font: =FontUI
                  Size: =SizeMeta
                  Color: =ClrTextMuted
                  VerticalAlign: =VerticalAlign.Middle

            - galCardSIs:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  X: =44
                  Y: =70
                  Width: =224
                  Height: =24
                  Items: =ThisItem.'Aligned SIs'
                  TemplateSize: =76
                  TemplatePadding: =0
                  ShowScrollbar: =false
                Children:
                  - recSIChipB:
                      Control: Classic/Button
                      Properties:
                        Text: =""
                        Fill: =ClrChip
                        HoverFill: =ClrChip
                        PressedFill: =ClrChip
                        OnSelect: =false
                        X: =0
                        Y: =1
                        Width: =72
                        Height: =22
                        RadiusTopLeft: =RadiusChip
                        RadiusTopRight: =RadiusChip
                        RadiusBottomLeft: =RadiusChip
                        RadiusBottomRight: =RadiusChip
                  - lblSIChipB:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =1
                        Width: =72
                        Height: =22
                        Text: =ThisItem.Value
                        Font: =FontUI
                        Size: =SizeChip
                        Color: =ClrChipText
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle

            - lblHSCap:
                Control: Label
                Properties:
                  X: =14
                  Y: =98
                  Width: =28
                  Height: =24
                  Text: ="HS:"
                  Font: =FontUI
                  Size: =SizeMeta
                  Color: =ClrTextMuted
                  VerticalAlign: =VerticalAlign.Middle

            - galCardHype:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  X: =44
                  Y: =98
                  Width: =224
                  Height: =24
                  Items: =ThisItem.Hyperscalers
                  TemplateSize: =76
                  TemplatePadding: =0
                  ShowScrollbar: =false
                Children:
                  - recHSChipB:
                      Control: Classic/Button
                      Properties:
                        Text: =""
                        Fill: =ClrChip
                        HoverFill: =ClrChip
                        PressedFill: =ClrChip
                        OnSelect: =false
                        X: =0
                        Y: =1
                        Width: =72
                        Height: =22
                        RadiusTopLeft: =RadiusChip
                        RadiusTopRight: =RadiusChip
                        RadiusBottomLeft: =RadiusChip
                        RadiusBottomRight: =RadiusChip
                  - lblHSChipB:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =1
                        Width: =72
                        Height: =22
                        Text: =ThisItem.Value
                        Font: =FontUI
                        Size: =SizeChip
                        Color: =ClrChipText
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle

            - recCardDivider:
                Control: Rectangle
                Properties:
                  X: =14
                  Y: =128
                  Width: =254
                  Height: =1
                  Fill: =ClrDivider

            - lblNextCap:
                Control: Label
                Properties:
                  X: =14
                  Y: =134
                  Width: =254
                  Height: =16
                  Text: ="NEXT ACTION"
                  Font: =FontUI
                  Size: =SizeMeta
                  Color: =ClrTextMuted

            - lblNextTask:
                Control: Label
                Properties:
                  X: =14
                  Y: =150
                  Width: =254
                  Height: =32
                  Text: =If(IsBlank(ThisItem.NextActionTitle), "No open actions", Clip(ThisItem.NextActionTitle, 68))
                  Font: =FontUI
                  Size: =SizeBody
                  Color: =If(IsBlank(ThisItem.NextActionTitle), ClrTextFaint, ClrText)
                  Wrap: =true
                  VerticalAlign: =VerticalAlign.Top

            - lblNextTaskDue:
                Control: Label
                Properties:
                  X: =14
                  Y: =182
                  Width: =254
                  Height: =18
                  Text: =If(IsBlank(ThisItem.NextActionDue), "", Text(ThisItem.NextActionDue, "mmmm d"))
                  Font: =FontUI
                  Size: =SizeBody
                  Color: =ClrDate
