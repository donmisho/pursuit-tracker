            - galCardHype:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  Height: =24
                  Items: =ThisItem.Hyperscalers
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =84
                  Width: =recCard.Width - 62
                  X: =48
                  Y: =118
                Children:
                  - recHSChipB:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Fill: =ClrChip
                        Height: =22
                        HoverFill: =ClrChip
                        PressedFill: =ClrChip
                        RadiusBottomLeft: =RadiusChip
                        RadiusBottomRight: =RadiusChip
                        RadiusTopLeft: =RadiusChip
                        RadiusTopRight: =RadiusChip
                        Text: =""
                        Width: =80
                        Y: =1
                  - lblHSChipB:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
