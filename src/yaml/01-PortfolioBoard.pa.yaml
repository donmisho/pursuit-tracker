                        Font: =FontUI
                        Height: =22
                        Size: =SizeChip
                        Text: =ThisItem.Value
                        Width: =80
                        Wrap: =false
                        Y: =1
            - recCardDivider:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ClrDivider
                  Height: =1
                  Width: =recCard.Width - 28
                  X: =14
                  Y: =150
            - lblNextCap:
