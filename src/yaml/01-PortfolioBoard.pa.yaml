# scrPortfolioBoard — complete screen.
#
# Round-tripped out of Studio, so this matches what's on the canvas. Control versions
# (@2.5.1 etc.) are Studio's own and are kept verbatim. Properties equal to a control
# default (X/Y of 0, VerticalAlign Middle, ShowScrollbar true) are omitted, which is how
# Studio emits them.
#
# PASTE: create all four screens first (scrPortfolioBoard / scrPortfolioList /
# scrPursuitWorkspace / scrPursuitDocsAI) and set App.Formulas + App.OnStart, then
# right-click scrPortfolioBoard in the tree view -> Paste. Set the screen's Fill to
# =ClrPage and its OnVisible from src/screens/scrPortfolioBoard.OnVisible.powerfx.
#
# Laid out for Tablet (1366 x 768) with "Scale to fit" OFF.
#
# CONTROL TYPES: buttons and inputs use the Classic/ prefix -- the unprefixed names
# resolve to the modern Fluent controls, which have no Fill, Color or Radius properties.
# Rounded shapes are Classic/Button with Text "" rather than Rectangle: the classic
# Rectangle has no Radius properties at all, and Button is the only classic control that
# does. Square shapes (rules, dividers, accent bars) stay Rectangle.
#
# Z-ORDER: document order is z-order, and anything clickable must be declared AFTER
# everything it overlaps. btnCardClick covers the whole card and so comes after the card's
# content; lblMoveHandle comes after btnCardClick so the handle still gets its own clicks.
# lblDropHint sits on top of recDropTarget and therefore carries the same OnSelect --
# without it the label swallows the click and "Move here" does nothing.

- navBg:
    Control: Rectangle@2.3.0
    Properties:
      Fill: =ClrNav
      Height: =64
      Width: =Parent.Width
- navRule:
    Control: Rectangle@2.3.0
    Properties:
      Fill: =ClrBorder
      Height: =1
      Width: =Parent.Width
      Y: =63
- navBrand:
    Control: Label@2.5.1
    Properties:
      Color: =ClrText
      Font: =FontUI
      FontWeight: =FontWeight.Semibold
      Height: =64
      Size: =14
      Text: ="Pursuit Tracker"
      Width: =180
      X: =GapPage
- btnNavBoard:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =ClrAccentText
      Fill: =ClrAccent
      Font: =FontUI
      Height: =36
      HoverColor: =ClrAccentText
      HoverFill: =ClrAccentHover
      PressedColor: =ClrAccentText
      PressedFill: =ClrAccentHover
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =12
      Text: ="Portfolio board"
      Width: =170
      X: =210
      Y: =14
- btnNavList:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =ClrTextMuted
      Fill: =ClrNav
      Font: =FontUI
      Height: =36
      HoverColor: =ClrText
      HoverFill: =ClrCardHover
      OnSelect: =Navigate(scrPortfolioList, ScreenTransition.None)
      PressedColor: =ClrText
      PressedFill: =ClrCardHover
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =12
      Text: ="Portfolio list"
      X: =390
      Y: =14
- btnNavWorkspace:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =ClrTextMuted
      DisplayMode: =If(IsBlank(gblPursuitKey), DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ClrNav
      Font: =FontUI
      Height: =36
      HoverColor: =ClrText
      HoverFill: =ClrCardHover
      OnSelect: =Set(gblNewPursuit, false); Navigate(scrPursuitWorkspace, ScreenTransition.None)
      PressedColor: =ClrText
      PressedFill: =ClrCardHover
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =12
      Text: ="Pursuit workspace"
      Width: =190
      X: =560
      Y: =14
- btnNavDocsAI:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =ClrTextMuted
      DisplayMode: =If(IsBlank(gblPursuitKey), DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =ClrNav
      Font: =FontUI
      Height: =36
      HoverColor: =ClrText
      HoverFill: =ClrCardHover
      OnSelect: =Set(gblNewPursuit, false); Navigate(scrPursuitDocsAI, ScreenTransition.None)
      PressedColor: =ClrText
      PressedFill: =ClrCardHover
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =12
      Text: ="Documents & AI"
      Width: =200
      X: =760
      Y: =14
- lblPageTitle:
    Control: Label@2.5.1
    Properties:
      Color: =ClrText
      Font: =FontUI
      FontWeight: =FontWeight.Semibold
      Height: =36
      Size: =SizePageTitle
      Text: ="SI Pursuit Management"
      Width: =700
      X: =GapPage
      Y: =88
- lblPageSub:
    Control: Label@2.5.1
    Properties:
      Color: =If(IsBlank(gblMoving), ClrTextMuted, ClrAccent)
      Font: =FontUI
      Height: =24
      Size: =SizeBody
      Text: |
        =If(
            IsBlank(gblMoving),
            "Select the move handle on a pursuit, then choose its new stage.",
            "Moving " & gblMoving.'Pursuit Name' & " — choose a stage, or press the handle again to cancel."
        )
      Width: =900
      X: =GapPage
      Y: =126
- btnNewPursuit:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =ClrAccentText
      Fill: =ClrAccent
      Font: =FontUI
      HoverColor: =ClrAccentText
      HoverFill: =ClrAccentHover
      OnSelect: =Set(gblPursuitKey, Blank()); Set(gblNewPursuit, true); Navigate(scrPursuitWorkspace, ScreenTransition.None)
      PressedColor: =ClrAccentText
      PressedFill: =ClrAccentHover
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Size: =12
      Text: ="Add pursuit"
      Width: =150
      X: =Parent.Width - Self.Width - GapPage
      Y: =96
- galStages:
    Control: Gallery@2.15.0
    Variant: Horizontal
    Properties:
      Height: =Parent.Height - 170 - GapPage
      Items: =colStages
      TemplatePadding: =0
      TemplateSize: =(Parent.Width - (GapPage * 2)) / BoardColumns
      Width: =Parent.Width - (GapPage * 2)
      X: =GapPage
      Y: =170
    Children:
      - colBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ClrBorder
            BorderThickness: =1
            Fill: =ClrColumn
            Height: =Parent.Height - 8
            Width: =Parent.TemplateWidth - 12
      - recStageAccent:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =StageAccent(ThisItem.Stage)
            Height: =3
            Width: =colBg.Width
      - lblStageName:
          Control: Label@2.5.1
          Properties:
            Color: =ClrText
            Font: =FontUI
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =SizeBody
            Text: =ThisItem.Stage
            Width: =colBg.Width - 72
            X: =16
            Y: =14
      - lblStageCount:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ClrTextMuted
            Font: =FontUI
            Height: =32
            Size: =SizeBody
            Text: =CountRows(Filter(colPortfolio, 'Workflow Stage'.Value = ThisItem.Stage))
            Width: =36
            X: =colBg.Width - 52
            Y: =14
      - recDropTarget:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ClrAccent
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =1
            Fill: =ColorFade(ClrAccent, 0.75)
            Height: =44
            OnSelect: |
              =Patch(
                  'pursuit-tracker-pursuits',
                  LookUp('pursuit-tracker-pursuits', Title = gblMoving.Title),
                  { 'Workflow Stage': { Value: ThisItem.Stage } }
              );
              Set(gblMoving, Blank());
              ClearCollect(
                  colPortfolio,
                  AddColumns(
                      'pursuit-tracker-pursuits' As P,
                      OwnerName,
                      Coalesce(LookUp(colPeople, Email = P.'WM Pursuit Owner Entra ID').Name, P.'WM Pursuit Owner Entra ID'),
                      NextActionTitle,
                      First(Sort(Filter(colActions, 'Pursuit ID' = P.Title, Status.Value <> "Completed", Not(IsBlank('Due Date'))), 'Due Date', SortOrder.Ascending)).'Action Title',
                      NextActionDue,
                      First(Sort(Filter(colActions, 'Pursuit ID' = P.Title, Status.Value <> "Completed", Not(IsBlank('Due Date'))), 'Due Date', SortOrder.Ascending)).'Due Date',
                      SIsText,  Concat(P.'Aligned SIs', Value, ", "),
                      HypeText, Concat(P.Hyperscalers, Value, ", ")
                  )
              );
              Notify("Moved to " & ThisItem.Stage, NotificationType.Success, 2000)
            Visible: =Not(IsBlank(gblMoving)) && gblMoving.'Workflow Stage'.Value <> ThisItem.Stage
            Width: =colBg.Width - 28
            X: =14
            Y: =52
      - lblDropHint:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ClrAccent
            Font: =FontUI
            Height: =44
            OnSelect: |
              =Patch(
                  'pursuit-tracker-pursuits',
                  LookUp('pursuit-tracker-pursuits', Title = gblMoving.Title),
                  { 'Workflow Stage': { Value: ThisItem.Stage } }
              );
              Set(gblMoving, Blank());
              ClearCollect(
                  colPortfolio,
                  AddColumns(
                      'pursuit-tracker-pursuits' As P,
                      OwnerName,
                      Coalesce(LookUp(colPeople, Email = P.'WM Pursuit Owner Entra ID').Name, P.'WM Pursuit Owner Entra ID'),
                      NextActionTitle,
                      First(Sort(Filter(colActions, 'Pursuit ID' = P.Title, Status.Value <> "Completed", Not(IsBlank('Due Date'))), 'Due Date', SortOrder.Ascending)).'Action Title',
                      NextActionDue,
                      First(Sort(Filter(colActions, 'Pursuit ID' = P.Title, Status.Value <> "Completed", Not(IsBlank('Due Date'))), 'Due Date', SortOrder.Ascending)).'Due Date',
                      SIsText,  Concat(P.'Aligned SIs', Value, ", "),
                      HypeText, Concat(P.Hyperscalers, Value, ", ")
                  )
              );
              Notify("Moved to " & ThisItem.Stage, NotificationType.Success, 2000)
            Size: =SizeBody
            Text: ="Move here"
            Visible: =recDropTarget.Visible
            Width: =colBg.Width - 28
            X: =14
            Y: =52
      - galCards:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =colBg.Height - Self.Y - 14
            Items: |
              =Sort(
                  Filter(colPortfolio, 'Workflow Stage'.Value = ThisItem.Stage),
                  If(IsBlank('Target Decision Date'), Date(2099, 12, 31), 'Target Decision Date'),
                  SortOrder.Ascending
              )
            TemplatePadding: =6
            TemplateSize: =240
            Width: =colBg.Width - 28
            X: =14
            Y: =If(recDropTarget.Visible, 104, 56)
          Children:
            - recCard:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(gblMoving.Title = ThisItem.Title, ClrAccent, ClrBorder)
                  BorderThickness: =If(gblMoving.Title = ThisItem.Title, 2, 1)
                  Fill: =ClrCard
                  Height: =228
                  HoverFill: =ClrCardHover
                  OnSelect: =Set(gblPursuitKey, ThisItem.Title); Set(gblNewPursuit, false); Navigate(scrPursuitWorkspace, ScreenTransition.None)
                  PressedFill: =ClrCardHover
                  RadiusBottomLeft: =RadiusCard
                  RadiusBottomRight: =RadiusCard
                  RadiusTopLeft: =RadiusCard
                  RadiusTopRight: =RadiusCard
                  Text: =""
                  Width: =Parent.Width - 20
            - recHealth:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(ThisItem.Health.Value = "At risk", ClrRiskFill, Color.Transparent)
                  Height: =228
                  Width: =3
            - lblCardAccount:
                Control: Label@2.5.1
                Properties:
                  Color: =ClrText
                  Font: =FontUI
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =SizeCardTitle
                  Text: =Clip(ThisItem.'Account Name', 26)
                  Width: =recCard.Width - 54
                  Wrap: =false
                  X: =14
                  Y: =8
            - lblCardTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =ClrText
                  Font: =FontUI
                  Height: =54
                  Size: =SizeBody
                  Text: |
                    =Clip(
                        With(
                            { n: ThisItem.'Pursuit Name' },
                            Trim(
                                If(
                                    !IsBlank(Find(": ", n)),  Mid(n, Find(": ", n) + 2),
                                    !IsBlank(Find(" - ", n)), Mid(n, Find(" - ", n) + 3),
                                    n
                                )
                            )
                        ),
                        88
                    )
                  VerticalAlign: =VerticalAlign.Top
                  Width: =recCard.Width - 28
                  X: =14
                  Y: =32
            - lblSICap:
                Control: Label@2.5.1
                Properties:
                  Color: =ClrTextMuted
                  Font: =FontUI
                  Height: =24
                  Size: =SizeMeta
                  Text: ="SI:"
                  Width: =32
                  Wrap: =false
                  X: =14
                  Y: =90
            - galCardSIs:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  Height: =24
                  Items: =ThisItem.'Aligned SIs'
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =84
                  Width: =recCard.Width - 62
                  X: =48
                  Y: =90
                Children:
                  - recSIChipB:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Fill: =ClrChip
                        Height: =22
                        HoverFill: =ClrChip
                        PressedFill: =ClrChip
                        RadiusBottomLeft: =RadiusChip
                        RadiusBottomRight: =RadiusChip
                        RadiusTopLeft: =RadiusChip
                        RadiusTopRight: =RadiusChip
                        Text: =""
                        Width: =80
                        Y: =1
                  - lblSIChipB:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ClrChipText
                        Font: =FontUI
                        Height: =22
                        Size: =SizeChip
                        Text: =ThisItem.Value
                        Width: =80
                        Wrap: =false
                        Y: =1
            - lblHSCap:
                Control: Label@2.5.1
                Properties:
                  Color: =ClrTextMuted
                  Font: =FontUI
                  Height: =24
                  Size: =SizeMeta
                  Text: ="HS:"
                  Width: =32
                  Wrap: =false
                  X: =14
                  Y: =118
            - galCardHype:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  Height: =24
                  Items: =ThisItem.Hyperscalers
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =84
                  Width: =recCard.Width - 62
                  X: =48
                  Y: =118
                Children:
                  - recHSChipB:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Fill: =ClrChip
                        Height: =22
                        HoverFill: =ClrChip
                        PressedFill: =ClrChip
                        RadiusBottomLeft: =RadiusChip
                        RadiusBottomRight: =RadiusChip
                        RadiusTopLeft: =RadiusChip
                        RadiusTopRight: =RadiusChip
                        Text: =""
                        Width: =80
                        Y: =1
                  - lblHSChipB:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ClrChipText
                        Font: =FontUI
                        Height: =22
                        Size: =SizeChip
                        Text: =ThisItem.Value
                        Width: =80
                        Wrap: =false
                        Y: =1
            - recCardDivider:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ClrDivider
                  Height: =1
                  Width: =recCard.Width - 28
                  X: =14
                  Y: =150
            - lblNextCap:
                Control: Label@2.5.1
                Properties:
                  Color: =ClrTextMuted
                  Font: =FontUI
                  Height: =16
                  Size: =SizeMeta
                  Text: ="NEXT ACTION"
                  Width: =recCard.Width - 28
                  Wrap: =false
                  X: =14
                  Y: =156
            - lblNextTask:
                Control: Label@2.5.1
                Properties:
                  Color: =If(IsBlank(ThisItem.NextActionTitle), ClrTextFaint, ClrText)
                  Font: =FontUI
                  Height: =32
                  Size: =SizeBody
                  Text: =If(IsBlank(ThisItem.NextActionTitle), "No open actions", Clip(ThisItem.NextActionTitle, 52))
                  VerticalAlign: =VerticalAlign.Top
                  Width: =recCard.Width - 28
                  X: =14
                  Y: =172
            - lblNextTaskDue:
                Control: Label@2.5.1
                Properties:
                  Color: =ClrDate
                  Font: =FontUI
                  Height: =18
                  Size: =SizeBody
                  Text: =If(IsBlank(ThisItem.NextActionDue), "", Text(ThisItem.NextActionDue, "mmmm d"))
                  Width: =recCard.Width - 28
                  X: =14
                  Y: =204
            - btnCardClick:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =Color.Transparent
                  Height: =228
                  HoverFill: =RGBA(255, 255, 255, 0.03)
                  OnSelect: =Set(gblPursuitKey, ThisItem.Title); Set(gblNewPursuit, false); Navigate(scrPursuitWorkspace, ScreenTransition.None)
                  PressedFill: =RGBA(255, 255, 255, 0.06)
                  Text: =""
                  Width: =recCard.Width
            - lblMoveHandle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gblMoving.Title = ThisItem.Title, ClrAccent, ClrTextFaint)
                  Font: =FontUI
                  Height: =28
                  OnSelect: =Set(gblMoving, If(gblMoving.Title = ThisItem.Title, Blank(), ThisItem))
                  Size: =12
                  Text: ="⋮⋮"
                  Tooltip: ="Move to another stage"
                  Width: =28
                  X: =recCard.Width - 36
                  Y: =8

# ---------------------------------------------------------------------------
# SCREEN PROPERTIES — set by hand:
#
#   Fill       =ClrPage
#   OnVisible  src/screens/scrPortfolioBoard.OnVisible.powerfx, pasted whole
#
# FALLBACKS — if Studio rejects the paste, it is almost always one of two controls:
#   galStages   a Horizontal gallery with a nested Vertical gallery (galCards). Insert
#               both by hand from the Insert pane and paste the property formulas in.
#   recCard     Classic/Button used as a rounded panel. If the Radius properties are
#               rejected, drop them and accept square corners.
# Every control and formula is also in docs/03-screen-portfolio-board.md as a property
# table, which always works.
# ---------------------------------------------------------------------------
