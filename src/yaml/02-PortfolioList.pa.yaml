          Properties:
            Color: =ClrText
            Font: =FontUI
            FontWeight: =FontWeight.Semibold
            Height: =46
            Size: =SizeBody
            Text: =Clip(ThisItem.'Account Name', 40)
            VerticalAlign: =VerticalAlign.Top
            Y: =10
      - lblRowTitle:
          Control: Label@2.5.1
          Properties:
            Color: =ClrText
            Font: =FontUI
            Height: =54
            Size: =SizeBody
            Text: |
              =Clip(
                  With(
                      { n: ThisItem.'Pursuit Name' },
                      Trim(
                          If(
                              !IsBlank(Find(": ", n)),  Mid(n, Find(": ", n) + 2),
                              !IsBlank(Find(" - ", n)), Mid(n, Find(" - ", n) + 3),
                              n
                          )
                      )
                  ),
                  96
              )
            VerticalAlign: =VerticalAlign.Top
            Width: =230
            X: =160
            Y: =10
      - lblRowSfLink:
