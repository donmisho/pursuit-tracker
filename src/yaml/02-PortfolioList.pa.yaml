# ---------------------------------------------------------------- the table
- galPortfolioList:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =GapPage
      Y: =250
      Width: =Parent.Width - (GapPage * 2)
      Height: =Parent.Height - 250 - 56
      # Account first, then pursuit -- groups an account's pursuits together, which
      # sorting on the pursuit name alone no longer does now that the name has its
      # account prefix stripped for display.
      Items: =Sort(colPortfolio, 'Account Name' & " " & 'Pursuit Name', SortOrder.Ascending)
      TemplateSize: =110
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - recRowDivider:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

      - lblRowAccount:
          Control: Label
          Properties:
            X: =0
            Y: =10
            Width: =150
            Height: =46
            Text: =Clip(ThisItem.'Account Name', 40)
            Font: =FontUI
            Size: =SizeBody
            FontWeight: =FontWeight.Semibold
            Color: =ClrText
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - lblRowTitle:
          Control: Label
          Properties:
            X: =160
            Y: =10
            Width: =230
            Height: =54
            # Account has its own column now, so drop the ALL-CAPS account prefix that
            # every pursuit name repeats. Proper() is deliberately not used -- it would
            # turn AWS into Aws and CD&R into Cd&R. Both separators in the data are
            # handled: "ACCOUNT: name" and "ACCOUNT - name".
            Text: |
              =Clip(
                  With(
                      { n: ThisItem.'Pursuit Name' },
                      Trim(
                          If(
                              !IsBlank(Find(": ", n)),  Mid(n, Find(": ", n) + 2),
                              !IsBlank(Find(" - ", n)), Mid(n, Find(" - ", n) + 3),
                              n
                          )
                      )
                  ),
                  96
              )
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrText
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - lblRowSfLink:
          Control: Label
          Properties:
            X: =160
            Y: =66
            Width: =230
            Height: =18
            Text: =If(IsBlank(ThisItem.'Salesforce Opportunity URL'), "No Salesforce opportunity", "Salesforce opportunity linked")
            Font: =FontUI
            Size: =SizeMeta
            Color: =ClrTextFaint

      - lblRowStage:
          Control: Label
          Properties:
            X: =434
            Y: =10
            Width: =170
            Height: =46
            Text: =Clip(ThisItem.'Workflow Stage'.Value, 52)
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrTextMuted
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - recRowAvatar:
          Control: Classic/Button
          Properties:
            Text: =""
            Fill: =ClrAvatar
            HoverFill: =ClrAvatar
            PressedFill: =ClrAvatar
            OnSelect: =false
            X: =614
            Y: =12
            Width: =24
            Height: =24
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12

      - lblRowInitials:
          Control: Label
          Properties:
            X: =614
            Y: =12
            Width: =24
            Height: =24
            Text: =Initials(ThisItem.OwnerName)
            Font: =FontUI
            Size: =SizeChip
            Color: =ClrAvatarText
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - lblRowOwner:
          Control: Label
          Properties:
            X: =646
            Y: =12
            Width: =150
            Height: =24
            Text: =ThisItem.OwnerName
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrText
            VerticalAlign: =VerticalAlign.Middle

      - galRowSIs:
          Control: Gallery
          Variant: Vertical
          Properties:
            X: =804
            Y: =10
            Width: =130
            Height: =84
            Items: =ThisItem.'Aligned SIs'
            TemplateSize: =28
            TemplatePadding: =0
            ShowScrollbar: =false
          Children:
            - recSIChip:
                Control: Classic/Button
                Properties:
                  Text: =""
                  Fill: =ClrChip
                  HoverFill: =ClrChip
                  PressedFill: =ClrChip
                  OnSelect: =false
                  X: =0
                  Y: =2
                  Width: =124
                  Height: =22
                  RadiusTopLeft: =RadiusChip
                  RadiusTopRight: =RadiusChip
                  RadiusBottomLeft: =RadiusChip
                  RadiusBottomRight: =RadiusChip
            - lblSIChip:
                Control: Label
                Properties:
                  X: =0
                  Y: =2
                  Width: =124
                  Height: =22
                  Text: =ThisItem.Value
                  Font: =FontUI
                  Size: =SizeChip
                  Color: =ClrChipText
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle

      - galRowHype:
          Control: Gallery
          Variant: Vertical
          Properties:
            X: =944
            Y: =10
            Width: =130
            Height: =84
            Items: =ThisItem.Hyperscalers
            TemplateSize: =28
            TemplatePadding: =0
            ShowScrollbar: =false
          Children:
            - recHypeChip:
                Control: Classic/Button
                Properties:
                  Text: =""
                  Fill: =ClrChip
                  HoverFill: =ClrChip
                  PressedFill: =ClrChip
                  OnSelect: =false
                  X: =0
                  Y: =2
                  Width: =124
                  Height: =22
                  RadiusTopLeft: =RadiusChip
                  RadiusTopRight: =RadiusChip
                  RadiusBottomLeft: =RadiusChip
                  RadiusBottomRight: =RadiusChip
            - lblHypeChip:
                Control: Label
                Properties:
                  X: =0
                  Y: =2
                  Width: =124
                  Height: =22
                  Text: =ThisItem.Value
                  Font: =FontUI
                  Size: =SizeChip
                  Color: =ClrChipText
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle

      - lblRowNextTask:
          Control: Label
          Properties:
            X: =1084
            Y: =10
            Width: =210
            Height: =42
            Text: =If(IsBlank(ThisItem.NextActionTitle), "No open actions", Clip(ThisItem.NextActionTitle, 58))
            Font: =FontUI
            Size: =SizeBody
            Color: =If(IsBlank(ThisItem.NextActionTitle), ClrTextFaint, ClrText)
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - lblRowNextDue:
          Control: Label
          Properties:
            X: =1084
            Y: =54
            Width: =210
            Height: =20
            Text: =If(IsBlank(ThisItem.NextActionDue), "", Text(ThisItem.NextActionDue, "mmmm d"))
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrDate

      # ---- row click layer --------------------------------------------------
      # Transparent, and ON TOP of the row's content rather than behind it. Canvas
      # controls capture their own pointer events, so a click target underneath the
      # labels would only fire in the gaps between them. Everything below this line in
      # the file sits above it and stays clickable.
      - btnRowClick:
          Control: Classic/Button
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width - 20
            Height: =Parent.TemplateHeight - 1
            Fill: =Color.Transparent
            HoverFill: =RGBA(255, 255, 255, 0.04)
            PressedFill: =RGBA(255, 255, 255, 0.07)
            BorderThickness: =0
            OnSelect: =Set(gblRowMenu, ""); Set(gblPursuitKey, ThisItem.Title); Set(gblNewPursuit, false); Navigate(scrPursuitWorkspace, ScreenTransition.None)

      # ---- per-row ⋯ menu ---------------------------------------------------
      - btnRowMenu:
          Control: Classic/Button
          Properties:
            X: =396
            Y: =12
            Width: =28
            Height: =28
            Text: ="⋯"
            Font: =FontUI
            Size: =14
            Fill: =Color.Transparent
            Color: =ClrTextMuted
            HoverFill: =ClrCardHover
            HoverColor: =ClrText
            PressedFill: =ClrCardHover
            PressedColor: =ClrText
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Tooltip: ="More actions"
            OnSelect: =Set(gblRowMenu, If(gblRowMenu = ThisItem.Title, "", ThisItem.Title))

      - recRowMenu:
          Control: Classic/Button
          Properties:
            Text: =""
            X: =396
            Y: =40
            Width: =230
            Height: =70
            Visible: =gblRowMenu = ThisItem.Title
            Fill: =ClrColumn
            HoverFill: =ClrColumn
            PressedFill: =ClrColumn
            OnSelect: =false
            BorderColor: =ClrBorder
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6

      - btnMenuWorkspace:
          Control: Classic/Button
          Properties:
            X: =401
            Y: =45
            Width: =220
            Height: =30
            Visible: =gblRowMenu = ThisItem.Title
            Text: ="Open pursuit workspace"
            Font: =FontUI
            Size: =11
            Align: =Align.Left
            Fill: =ClrColumn
            Color: =ClrText
            HoverFill: =ClrCardHover
            HoverColor: =ClrText
            PressedFill: =ClrCardHover
            PressedColor: =ClrText
            BorderThickness: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            OnSelect: =Set(gblRowMenu, ""); Set(gblPursuitKey, ThisItem.Title); Set(gblNewPursuit, false); Navigate(scrPursuitWorkspace, ScreenTransition.None)

      - btnMenuSalesforce:
          Control: Classic/Button
          Properties:
            X: =401
            Y: =75
            Width: =220
            Height: =30
            Visible: =gblRowMenu = ThisItem.Title
            Text: =If(IsBlank(ThisItem.'Salesforce Opportunity URL'), "No Salesforce opportunity", "Open Salesforce opportunity")
            Font: =FontUI
            Size: =11
            Align: =Align.Left
            Fill: =ClrColumn
            Color: =ClrLink
            HoverFill: =ClrCardHover
            HoverColor: =ClrLink
            PressedFill: =ClrCardHover
            PressedColor: =ClrLink
            DisabledFill: =ClrColumn
            DisabledColor: =ClrTextFaint
            BorderThickness: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            DisplayMode: =If(IsBlank(ThisItem.'Salesforce Opportunity URL'), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =Set(gblRowMenu, ""); Launch(ThisItem.'Salesforce Opportunity URL')

