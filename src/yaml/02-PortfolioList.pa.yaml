# scrPortfolioList — complete screen. Paste onto scrPortfolioList.
# Tablet (1366 x 768), "Scale to fit" OFF. See 01-PortfolioBoard.pa.yaml for paste
# instructions and fallbacks.
#
# CONTROL TYPES: buttons and inputs use the Classic/ prefix -- the unprefixed names
# resolve to the modern Fluent controls, which have no Fill, Color or Radius properties.
# Rounded shapes are Classic/Button with Text "" rather than Rectangle: the classic
# Rectangle has no Radius properties at all, and Button is the only classic control that
# does. Square shapes (rules, dividers) stay Rectangle.
#
# COLUMNS (X relative to the gallery, +24 for the header labels above it):
#   Account 0/150 · Pursuit 160/230 · ⋯ 396/28 · Stage 434/170 · Owner 614/180
#   SIs 804/130 · Hyperscalers 944/130 · Next task 1084/210

