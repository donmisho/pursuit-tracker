- galPortfolioList:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Height: =Parent.Height - 250 - 56
      Items: |
        =Sort(
            Filter(
                colPortfolio,
                drpFltSI.Selected.Value = "All" || drpFltSI.Selected.Value in SIsText,
                drpFltHype.Selected.Value = "All" || drpFltHype.Selected.Value in HypeText,
                drpFltActive.Selected.Value = "All" || drpFltActive.Selected.Value = ActiveText
            ),
            'Account Name' & " " & 'Pursuit Name',
            SortOrder.Ascending
        )
      TemplatePadding: =0
      TemplateSize: =110
      Width: =Parent.Width - (GapPage * 2)
      X: =GapPage
      Y: =250
    Children:
      - recRowDivider:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =ClrDivider
            Height: =1
            Width: =Parent.Width - 20
            Y: =Parent.TemplateHeight - 1
