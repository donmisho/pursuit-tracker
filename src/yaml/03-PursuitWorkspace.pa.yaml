- btnPanelDelete:
    Control: Classic/Button
    Properties:
      X: =Parent.Width - 616
      Y: =Parent.Height - 76
      Width: =110
      Height: =40
      Visible: =gblPanel <> "" && gblPanel <> "pursuit" && gblEditKey <> ""
      Text: ="Delete"
      Font: =FontUI
      Size: =12
      Fill: =ClrCard
      Color: =ClrRiskText
      HoverFill: =ClrRiskFill
      HoverColor: =ClrRiskText
      PressedFill: =ClrRiskFill
      PressedColor: =ClrRiskText
      BorderColor: =ClrRiskFill
      BorderThickness: =1
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: |
        =If(
            gblPanel = "action",
            Remove('pursuit-tracker-actions', LookUp('pursuit-tracker-actions', Title = gblEditKey));
            ClearCollect(colActions, 'pursuit-tracker-actions');
        ClearCollect(
            colActions_P,
            AddColumns(
                Sort(Filter('pursuit-tracker-actions', 'Pursuit ID' = gblPursuitKey), If(IsBlank('Due Date'), Date(2099, 12, 31), 'Due Date'), SortOrder.Ascending) As A,
                DueWording,
                If(!IsBlank(A.'Due Date') || IsBlank(A.'Predecessor Action ID'), "",
                   "After " & Lower(LookUp('pursuit-tracker-actions', Title = A.'Predecessor Action ID').'Workflow Stage'.Value))
            )
        ),
        
            gblPanel = "doc",
            Remove('pursuit-tracker-documents', LookUp('pursuit-tracker-documents', Title = gblEditKey));
            ClearCollect(colDocs, Sort(Filter('pursuit-tracker-documents', 'Pursuit ID' = gblPursuitKey), 'Added Date', SortOrder.Descending)),
        
            gblPanel = "update",
            Remove('pursuit-tracker-status-updates', LookUp('pursuit-tracker-status-updates', Title = gblEditKey));
            ClearCollect(colUpdates, Sort(Filter('pursuit-tracker-status-updates', 'Pursuit ID' = gblPursuitKey), 'Update Date', SortOrder.Descending)),
        
            false
        );
        Set(gblPanel, "")

- btnPanelCancel:
    Control: Classic/Button
    Properties:
      X: =Parent.Width - 292
