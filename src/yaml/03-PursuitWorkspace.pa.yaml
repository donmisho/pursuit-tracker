- lblPursuitName:
    Control: Label
    Properties:
      X: =GapPage
      Y: =128
      Width: =800
      Height: =24
      Text: |
        =If(gblNewPursuit, "Fill in the details panel and save to create it", Clip(
            With(
                { n: gblPursuit.'Pursuit Name' },
                Trim(
                    If(
                        !IsBlank(Find(": ", n)),  Mid(n, Find(": ", n) + 2),
                        !IsBlank(Find(" - ", n)), Mid(n, Find(" - ", n) + 3),
                        n
                    )
                )
            ),
            90
        ))
      Font: =FontUI
      Size: =SizeCardTitle
      Color: =ClrTextMuted
      Wrap: =false
      VerticalAlign: =VerticalAlign.Middle

