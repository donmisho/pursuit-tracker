      Font: =FontUI
      Size: =12
      Fill: =ClrCard
      Color: =ClrText
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: =Set(gblPanel, "")

- btnPanelSave:
    Control: Button
    Properties:
      X: =Parent.Width - 156
      Y: =Parent.Height - 76
      Width: =132
      Height: =40
      Visible: =gblPanel <> ""
      Text: ="Save"
      Font: =FontUI
      Size: =12
      Fill: =ClrAccent
      Color: =ClrAccentText
      HoverFill: =ClrAccentHover
      HoverColor: =ClrAccentText
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      DisplayMode: |
        =If(
            (gblPanel = "action" && !IsBlank(txtActionTitle.Text)) ||
            (gblPanel = "update" && !IsBlank(txtUpdateBody.Text)),
            DisplayMode.Edit,
            DisplayMode.Disabled
        )
      OnSelect: |
        =If(
            gblPanel = "action",

            With(
                { nextId: "ACT-" & Text(Coalesce(Max(ForAll('pursuit-tracker-actions' As A, Value(Right(A.Title, 3))), Value), 0) + 1, "000") },
                Collect(
                    'pursuit-tracker-actions',
                    {
                        Title:                   nextId,
                        'Pursuit ID':            gblPursuitKey,
                        'Action Title':          txtActionTitle.Text,
                        'Workflow Stage':        { Value: drpActionStage.Selected.Value },
                        'Action Owner Entra ID': cmbActionOwner.Selected.Mail,
                        Status:                  { Value: "Not started" },
                        Health:                  { Value: "On track" },
                        'Effort Size':           { Value: drpActionEffort.Selected.Value },
                        'Due Date':              dteActionDue.SelectedDate
                    }
                )
            );
            ClearCollect(colActions, 'pursuit-tracker-actions');
            ClearCollect(
                colActions_P,
                AddColumns(
                    Sort(Filter('pursuit-tracker-actions', 'Pursuit ID' = gblPursuitKey), If(IsBlank('Due Date'), Date(2099, 12, 31), 'Due Date'), SortOrder.Ascending) As A,
                    DueWording,
                    If(
                        !IsBlank(A.'Due Date') || IsBlank(A.'Predecessor Action ID'),
                        "",
                        "After " & Lower(LookUp('pursuit-tracker-actions', Title = A.'Predecessor Action ID').'Workflow Stage'.Value)
                    )
                )
            ),

            With(
                { nextId: "UPD-" & Text(Coalesce(Max(ForAll('pursuit-tracker-status-updates' As U, Value(Right(U.Title, 3))), Value), 0) + 1, "000") },
                Collect(
                    'pursuit-tracker-status-updates',
                    {
                        Title:                 nextId,
                        'Pursuit ID':          gblPursuitKey,
                        'Update Date':         Now(),
                        'Update Type':         { Value: drpUpdateType.Selected.Value },
                        'Update Text':         txtUpdateBody.Text,
                        'Risk / Decision':     { Value: drpUpdateRisk.Selected.Value },
                        'Created By Entra ID': gblUser.Email
                    }
                )
            );
            ClearCollect(
                colUpdates,
                Sort(Filter('pursuit-tracker-status-updates', 'Pursuit ID' = gblPursuitKey), 'Update Date', SortOrder.Descending)
            );
            Reset(txtUpdateBody)
        );
        Set(gblPanel, "")

