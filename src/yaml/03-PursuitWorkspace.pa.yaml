          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

# ================================================================ EDIT PANEL
- recPanelScrim:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Visible: =gblPanel <> ""
      Fill: =ColorFade(ClrPage, -0.4)
      OnSelect: =Set(gblPanel, "")

- recPanel:
    Control: Rectangle
    Properties:
      X: =Parent.Width - 640
      Y: =0
      Width: =640
      Height: =Parent.Height
      Visible: =gblPanel <> ""
      Fill: =ClrCard
      BorderColor: =ClrBorder
      BorderThickness: =1

- lblPanelHead:
    Control: Label
    Properties:
      X: =Parent.Width - 616
      Y: =24
      Width: =592
      Height: =30
      Visible: =gblPanel <> ""
      Text: |
        =Switch(
            gblPanel,
            "pursuit", If(gblNewPursuit, "New pursuit", "Pursuit details"),
            "action",  If(gblEditKey = "", "New action", "Edit action"),
            "doc",     If(gblEditKey = "", "New document link", "Edit document link"),
            "update",  If(gblEditKey = "", "New status update", "Edit status update"),
            ""
        )
      Font: =FontUI
      Size: =18
      FontWeight: =FontWeight.Semibold
      Color: =ClrText

