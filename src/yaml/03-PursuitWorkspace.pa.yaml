      FontWeight: =FontWeight.Semibold
      Color: =ClrText

- galActions:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =44
      Y: =614
      Width: =592
      Height: =116
      Items: =colActions_P
      TemplateSize: =56
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblActionTitle:
          Control: Label
          Properties:
            X: =0
            Y: =6
            Width: =230
            Height: =42
            Text: =ThisItem.'Action Title'
            Font: =FontUI
            Size: =SizeBody
            FontWeight: =FontWeight.Semibold
            Color: =If(ThisItem.Status.Value = "Completed", ClrTextFaint, ClrText)
            Wrap: =true

      - lblActionStage:
          Control: Label
          Properties:
            X: =240
            Y: =6
            Width: =140
            Height: =42
            Text: =ThisItem.'Workflow Stage'.Value
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrTextMuted
            Wrap: =true

      - lblActionEffort:
          Control: Label
          Properties:
            X: =390
            Y: =6
            Width: =80
            Height: =24
            Text: =ThisItem.'Effort Size'.Value
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrText

      - recActionPill:
          Control: Rectangle
          Properties:
            X: =480
            Y: =8
            Width: =84
            Height: =24
            Visible: =ThisItem.Health.Value = "At risk"
            Fill: =ClrRiskFill
            RadiusTopLeft: =RadiusChip
            RadiusTopRight: =RadiusChip
            RadiusBottomLeft: =RadiusChip
            RadiusBottomRight: =RadiusChip

      - lblActionPill:
          Control: Label
          Properties:
            X: =480
            Y: =8
            Width: =84
            Height: =24
            Visible: =recActionPill.Visible
            Text: ="At risk"
            Font: =FontUI
            Size: =SizeChip
            Color: =ClrRiskText
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - lblActionDue:
          Control: Label
          Properties:
            X: =480
            Y: =8
            Width: =110
            Height: =24
            Visible: =Not(recActionPill.Visible)
            Text: =DueLabel(ThisItem.'Due Date', ThisItem.DueWording)
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrTextMuted
            VerticalAlign: =VerticalAlign.Middle

      - recActionDivider:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

