- btnAddAction:
    Control: Classic/Button
    Properties:
      X: =cardActions.X + cardActions.Width - 52
      Y: =cardActions.Y + 16
      Width: =28
      Height: =28
      Text: ="+"
      Font: =FontUI
      Size: =16
      Fill: =ClrColumn
      Color: =ClrText
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
      DisplayMode: =If(gblNewPursuit, DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: =Set(gblPanel, "action"); Set(gblEditKey, ""); Set(gblEditAction, LookUp('pursuit-tracker-actions', ID < 0)); Reset(txtActTitle); Reset(drpActStage); Reset(drpActStatus); Reset(drpActHealth); Reset(drpActEffort); Reset(dteActDue); Reset(txtActOwner); Reset(txtActPred); Reset(txtActNotes)
      Tooltip: ="Add Action"

- drpAFStage:
    Control: Classic/DropDown
    Properties:
      X: =cardActions.X + 24
      Y: =cardActions.Y + 50
      Width: =(cardActions.Width - 60) / 4
      Height: =28
      Font: =FontUI
      Size: =SizeMeta
      Color: =ClrText
      Fill: =ClrColumn
      BorderColor: =ClrBorder
      Default: ="All"
      Items: =colFltStage
      TabIndex: =-1

- drpAFStatus:
    Control: Classic/DropDown
    Properties:
      X: =cardActions.X + 24 + ((cardActions.Width - 60) / 4 + 4)
      Y: =cardActions.Y + 50
      Width: =(cardActions.Width - 60) / 4
      Height: =28
      Font: =FontUI
      Size: =SizeMeta
      Color: =ClrText
      Fill: =ClrColumn
      BorderColor: =ClrBorder
      Default: ="All"
      Items: =colFltStatus
      TabIndex: =-1

- drpAFHealth:
    Control: Classic/DropDown
    Properties:
      X: =cardActions.X + 24 + ((cardActions.Width - 60) / 4 + 4) * 2
      Y: =cardActions.Y + 50
      Width: =(cardActions.Width - 60) / 4
      Height: =28
      Font: =FontUI
      Size: =SizeMeta
      Color: =ClrText
      Fill: =ClrColumn
      BorderColor: =ClrBorder
      Default: ="All"
      Items: =colFltHealth
      TabIndex: =-1

- drpAFEffort:
    Control: Classic/DropDown
    Properties:
      X: =cardActions.X + 24 + ((cardActions.Width - 60) / 4 + 4) * 3
      Y: =cardActions.Y + 50
      Width: =(cardActions.Width - 60) / 4
      Height: =28
      Font: =FontUI
      Size: =SizeMeta
      Color: =ClrText
      Fill: =ClrColumn
      BorderColor: =ClrBorder
      Default: ="All"
      Items: =colFltEffort
      TabIndex: =-1

- galActions:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =cardActions.X + 24
      Y: =cardActions.Y + 86
      Width: =cardActions.Width - 48
      Height: =cardActions.Height - 102
      Items: |
        =Sort(
            Sort(
                Filter(
                    colActions_P,
                    drpAFStage.Selected.Value  = "All" || drpAFStage.Selected.Value  = 'Workflow Stage'.Value,
                    drpAFStatus.Selected.Value = "All" || drpAFStatus.Selected.Value = Status.Value,
                    drpAFHealth.Selected.Value = "All" || drpAFHealth.Selected.Value = Health.Value,
                    drpAFEffort.Selected.Value = "All" || drpAFEffort.Selected.Value = 'Effort Size'.Value
                ),
                If(IsBlank('Due Date'), Date(2099, 12, 31), 'Due Date'),
                SortOrder.Ascending
            ),
            If(Status.Value = "Completed", 1, 0),
            SortOrder.Ascending
        )
      TemplateSize: =58
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblActionTitle:
          Control: Label
          Properties:
            X: =0
            Y: =6
            Width: =Parent.Width - 240
            Height: =44
            Text: =Clip(ThisItem.'Action Title', 70)
            Font: =FontUI
            Size: =SizeBody
            FontWeight: =FontWeight.Semibold
            Color: =If(ThisItem.Status.Value = "Completed", ClrTextFaint, ClrText)
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - lblActionMeta:
          Control: Label
          Properties:
            X: =0
            Y: =34
            Width: =Parent.Width - 240
            Height: =18
            Text: =ThisItem.'Workflow Stage'.Value & " · " & ThisItem.Status.Value & " · " & ThisItem.'Effort Size'.Value
            Font: =FontUI
            Size: =SizeMeta
            Color: =ClrTextFaint
            Wrap: =false

      - recActionPill:
          Control: Classic/Button
          Properties:
            Text: =""
            Fill: =ClrRiskFill
            HoverFill: =ClrRiskFill
            PressedFill: =ClrRiskFill
            OnSelect: =false
            X: =Parent.Width - 226
            Y: =8
            Width: =84
            Height: =24
            Visible: =ThisItem.Health.Value = "At Risk"
            RadiusTopLeft: =RadiusChip
            TabIndex: =-1
            RadiusTopRight: =RadiusChip
            RadiusBottomLeft: =RadiusChip
            RadiusBottomRight: =RadiusChip

      - lblActionPill:
          Control: Label
          Properties:
            X: =Parent.Width - 226
            Y: =8
            Width: =84
            Height: =24
            Visible: =recActionPill.Visible
            Text: ="At Risk"
            Font: =FontUI
            Size: =SizeChip
            Color: =ClrRiskText
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - lblActionDue:
          Control: Label
          Properties:
            X: =Parent.Width - 136
            Y: =8
            Width: =110
            Height: =24
            Text: =DueLabel(ThisItem.'Due Date', ThisItem.DueWording)
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrTextMuted
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false

      - recActionDivider:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

      - btnActionRow:
          Control: Classic/Button
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width - 20
            Height: =Parent.TemplateHeight - 1
            Fill: =Color.Transparent
            HoverFill: =RGBA(255, 255, 255, 0.04)
            PressedFill: =RGBA(255, 255, 255, 0.07)
            BorderThickness: =0
            Tooltip: ="Edit this action"
            OnSelect: =Set(gblPanel, "action"); Set(gblEditKey, ThisItem.Title); Set(gblEditAction, ThisItem); Reset(txtActTitle); Reset(drpActStage); Reset(drpActStatus); Reset(drpActHealth); Reset(drpActEffort); Reset(dteActDue); Reset(txtActOwner); Reset(txtActPred); Reset(txtActNotes)

- cardUpdates:
    Control: Classic/Button
    Properties:
      Text: =""
      Fill: =ClrCard
      HoverFill: =ClrCard
      PressedFill: =ClrCard
      OnSelect: =false
