      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: =Set(gblPanel, "pursuit"); Reset(txtPurAccount); Reset(txtPurName); Reset(drpPurStage); Reset(drpPurHealth); Reset(txtPurOwner); Reset(dtePurTarget); Reset(txtPurActive); Reset(txtPurSfId); Reset(txtPurSfUrl); Reset(cmbPurSIs); Reset(cmbPurHype); Reset(txtPurFees); Reset(txtPurAiVer)

