# scrPursuitWorkspace — complete screen. Paste onto scrPursuitWorkspace.
# Tablet (1366 x 768), positioned for that size and anchored to Parent.Width.
#
# CONTROL TYPES: buttons and inputs use the Classic/ prefix -- the unprefixed names
# resolve to the modern Fluent controls, which have no Fill, Color or Radius properties.
# Rounded shapes are Classic/Button with Text "" rather than Rectangle: the classic
# Rectangle has no Radius properties at all, and Button is the only classic control that
# does. Square shapes (rules, dividers, the panel scrim) stay Rectangle.
#
# EDITING MODEL: one slide-over panel, four modes, held in gblPanel --
#   "pursuit" | "action" | "doc" | "update" | ""  (closed)
# gblEditKey holds the ACT/DOC/UPD id being edited, or "" for a new record, which is
# what drives Save between Patch and Collect and whether Delete is offered.
# The three child records also live in gblEditAction / gblEditDoc / gblEditUpdate so the
# input Defaults have something typed to read even before anything is selected.

