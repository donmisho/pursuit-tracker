      TemplateSize: =56
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblVersion:
          Control: Label
          Properties:
            X: =0
            Y: =4
            Width: =400
            Height: =20
            Text: ="Version " & ThisItem.'Version Number' & If(ThisItem.'Is Current'.Value = "Yes", " · current", "")
