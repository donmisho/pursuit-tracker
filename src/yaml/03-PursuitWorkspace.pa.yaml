- btnPanelDelete:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =ClrRiskFill
      BorderThickness: =1
      Color: =ClrRiskText
      Fill: =ClrCard
      Font: =FontUI
      HoverColor: =ClrRiskText
      HoverFill: =ClrRiskFill
      OnSelect: |
        =If(
            gblPanel = "action",
            Remove('pursuit-tracker-actions', LookUp('pursuit-tracker-actions', Title = gblEditKey));
            ClearCollect(colActions, 'pursuit-tracker-actions');
                    ClearCollect(
                        colActions_P,
                        AddColumns(
                            Filter('pursuit-tracker-actions', 'Pursuit ID' = gblPursuitKey) As A,
                            DueWording,
                            If(!IsBlank(A.'Due Date') || IsBlank(A.'Predecessor Action ID'), "",
                               "After " & Lower(LookUp('pursuit-tracker-actions', Title = A.'Predecessor Action ID').'Workflow Stage'.Value))
                        )
                    ),

            gblPanel = "update",
            Remove('pursuit-tracker-status-updates', LookUp('pursuit-tracker-status-updates', Title = gblEditKey));
            ClearCollect(colUpdates, Sort(Filter('pursuit-tracker-status-updates', 'Pursuit ID' = gblPursuitKey), 'Update Date', SortOrder.Descending)),

            false
        );
        Set(gblPanel, "")
      PressedColor: =ClrRiskText
      PressedFill: =ClrRiskFill
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
