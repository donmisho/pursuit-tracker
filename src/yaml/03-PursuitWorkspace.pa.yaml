# ================================================ RIGHT — actions over updates
- cardActions:
    Control: Classic/Button
    Properties:
      Text: =""
      Fill: =ClrCard
      HoverFill: =ClrCard
      PressedFill: =ClrCard
      OnSelect: =false
      X: =GapPage + (Parent.Width - (GapPage * 3)) / 2 + GapPage
      Y: =176
      Width: =(Parent.Width - (GapPage * 3)) / 2
      Height: =(Parent.Height - 176 - GapPage - 16) / 2
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =RadiusCard
      RadiusTopRight: =RadiusCard
      RadiusBottomLeft: =RadiusCard
      RadiusBottomRight: =RadiusCard

- lblActionsHead:
    Control: Label
    Properties:
      X: =GapPage + (Parent.Width - (GapPage * 3)) / 2 + GapPage + 24
      Y: =192
      Width: =400
      Height: =24
      Text: ="Actions and dependencies"
      Font: =FontUI
      Size: =SizeCardTitle
      FontWeight: =FontWeight.Semibold
      Color: =ClrText
      Wrap: =false

- btnAddAction:
    Control: Classic/Button
    Properties:
      X: =cardActions.X + cardActions.Width - 96
      Y: =192
      Width: =72
      Height: =26
      Text: ="+ Add"
      Font: =FontUI
      Size: =11
      Fill: =ClrColumn
      Color: =ClrText
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
      DisplayMode: =If(gblNewPursuit, DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: =Set(gblPanel, "action"); Set(gblEditKey, ""); Set(gblEditAction, LookUp('pursuit-tracker-actions', ID < 0)); Reset(txtActTitle); Reset(drpActStage); Reset(drpActStatus); Reset(drpActHealth); Reset(drpActEffort); Reset(dteActDue); Reset(txtActOwner); Reset(txtActPred); Reset(txtActNotes)

- galActions:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =cardActions.X + 24
      Y: =228
      Width: =cardActions.Width - 48
      Height: =cardActions.Height - 68
      Items: |
        =Sort(
            Sort(colActions_P, If(IsBlank('Due Date'), Date(2099, 12, 31), 'Due Date'), SortOrder.Ascending),
            If(Status.Value = "Completed", 1, 0),
            SortOrder.Ascending
        )
      TemplateSize: =58
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblActionTitle:
          Control: Label
          Properties:
            X: =0
            Y: =6
            Width: =Parent.Width - 240
            Height: =44
            Text: =Clip(ThisItem.'Action Title', 70)
            Font: =FontUI
            Size: =SizeBody
            FontWeight: =FontWeight.Semibold
            Color: =If(ThisItem.Status.Value = "Completed", ClrTextFaint, ClrText)
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - lblActionMeta:
          Control: Label
          Properties:
            X: =0
            Y: =34
            Width: =Parent.Width - 240
            Height: =18
            Text: =ThisItem.'Workflow Stage'.Value & " · " & ThisItem.Status.Value & " · " & ThisItem.'Effort Size'.Value
            Font: =FontUI
            Size: =SizeMeta
            Color: =ClrTextFaint
            Wrap: =false

      - recActionPill:
          Control: Classic/Button
          Properties:
            Text: =""
            Fill: =ClrRiskFill
            HoverFill: =ClrRiskFill
            PressedFill: =ClrRiskFill
            OnSelect: =false
            X: =Parent.Width - 226
            Y: =8
            Width: =84
            Height: =24
            Visible: =ThisItem.Health.Value = "At risk"
            RadiusTopLeft: =RadiusChip
            RadiusTopRight: =RadiusChip
            RadiusBottomLeft: =RadiusChip
            RadiusBottomRight: =RadiusChip

      - lblActionPill:
          Control: Label
          Properties:
            X: =Parent.Width - 226
            Y: =8
            Width: =84
            Height: =24
            Visible: =recActionPill.Visible
            Text: ="At risk"
            Font: =FontUI
            Size: =SizeChip
            Color: =ClrRiskText
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - lblActionDue:
          Control: Label
          Properties:
            X: =Parent.Width - 136
            Y: =8
            Width: =110
            Height: =24
            Text: =DueLabel(ThisItem.'Due Date', ThisItem.DueWording)
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrTextMuted
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false

      - recActionDivider:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

      - btnActionRow:
          Control: Classic/Button
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width - 20
            Height: =Parent.TemplateHeight - 1
            Fill: =Color.Transparent
            HoverFill: =RGBA(255, 255, 255, 0.04)
            PressedFill: =RGBA(255, 255, 255, 0.07)
            BorderThickness: =0
            Tooltip: ="Edit this action"
            OnSelect: =Set(gblPanel, "action"); Set(gblEditKey, ThisItem.Title); Set(gblEditAction, ThisItem); Reset(txtActTitle); Reset(drpActStage); Reset(drpActStatus); Reset(drpActHealth); Reset(drpActEffort); Reset(dteActDue); Reset(txtActOwner); Reset(txtActPred); Reset(txtActNotes)

