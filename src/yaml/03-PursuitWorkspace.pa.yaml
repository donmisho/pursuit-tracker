# scrPursuitWorkspace — complete screen. Paste onto scrPursuitWorkspace.
#
# Two columns, each half the canvas:
#   LEFT   Opportunity details — every pursuit field, read-only, two per row,
#          in SharePoint column order. Edit via the details panel.
#   RIGHT  Actions and dependencies (top) over Status updates (bottom).
#
# Documents and the AI overview moved to scrPursuitDocsAI.
#
# CONTROL TYPES: buttons and inputs use the Classic/ prefix; rounded shapes are
# Classic/Button with Text "". Square shapes stay Rectangle. Anything clickable is
# declared AFTER everything it overlaps -- document order is z-order.

- navBg:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =64
      Fill: =ClrNav

- navRule:
    Control: Rectangle
    Properties:
      X: =0
      Y: =63
      Width: =Parent.Width
      Height: =1
      Fill: =ClrBorder

