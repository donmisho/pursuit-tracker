- galUpdates:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =cardUpdates.X + 24
      Y: =cardUpdates.Y + 52
      Width: =cardUpdates.Width - 48
      Height: =cardUpdates.Height - 68
      Items: |
        =Sort(
            Filter(
                colUpdates,
                Title <> First(colUpdates).Title,
                drpUFRisk.Selected.Value = "All" || drpUFRisk.Selected.Value = 'Risk / Decision'.Value,
                drpUFDate.Selected.Days = 0 || 'Update Date' >= DateAdd(Now(), -drpUFDate.Selected.Days, TimeUnit.Days)
            ),
            'Update Date',
            SortOrder.Descending
        )
      TemplateSize: =48
      TemplatePadding: =0
      ShowScrollbar: =true
