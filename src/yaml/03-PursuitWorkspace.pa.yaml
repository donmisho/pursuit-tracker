      Size: =11
      Fill: =ClrColumn
      Color: =ClrText
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
      DisplayMode: =If(gblNewPursuit, DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: =Set(gblPanel, "update"); Set(gblEditKey, ""); Set(gblEditUpdate, LookUp('pursuit-tracker-status-updates', ID < 0)); Reset(txtUpdText); Reset(drpUpdType); Reset(drpUpdRisk)

- galUpdates:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =cardUpdates.X + 24
      Y: =cardUpdates.Y + 52
      Width: =cardUpdates.Width - 48
      Height: =cardUpdates.Height - 68
      Items: =Sort(colUpdates, 'Update Date', SortOrder.Descending)
      TemplateSize: =76
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblUpdateStamp:
          Control: Label
          Properties:
            X: =0
            Y: =6
            Width: =Parent.Width - 120
            Height: =16
            Text: =Text(ThisItem.'Update Date', "mmm d, yyyy · h:mm AM/PM") & " · " & Lower(ThisItem.'Update Type'.Value)
            Font: =FontUI
            Size: =SizeMeta
            Color: =ClrTextFaint
            Wrap: =false

      - lblUpdateBody:
          Control: Label
          Properties:
            X: =0
            Y: =24
            Width: =Parent.Width - 120
            Height: =40
            Text: =Clip(ThisItem.'Update Text', 150)
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrText
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - recUpdateTag:
          Control: Classic/Button
          Properties:
            Text: =""
            Fill: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskFill, ClrChip)
            HoverFill: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskFill, ClrChip)
            PressedFill: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskFill, ClrChip)
            OnSelect: =false
            X: =Parent.Width - 106
            Y: =6
            Width: =76
            Height: =22
            Visible: =Not(IsBlank(ThisItem.'Risk / Decision'.Value))
            RadiusTopLeft: =RadiusChip
            RadiusTopRight: =RadiusChip
            RadiusBottomLeft: =RadiusChip
            RadiusBottomRight: =RadiusChip

      - lblUpdateTag:
          Control: Label
          Properties:
            X: =Parent.Width - 106
            Y: =6
            Width: =76
            Height: =22
            Visible: =recUpdateTag.Visible
            Text: =ThisItem.'Risk / Decision'.Value
            Font: =FontUI
            Size: =SizeChip
            Color: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskText, ClrChipText)
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - recUpdateDivider:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

      - btnUpdateRow:
          Control: Classic/Button
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width - 20
            Height: =Parent.TemplateHeight - 1
            Fill: =Color.Transparent
            HoverFill: =RGBA(255, 255, 255, 0.04)
            PressedFill: =RGBA(255, 255, 255, 0.07)
            BorderThickness: =0
            Tooltip: ="Edit this update"
            OnSelect: =Set(gblPanel, "update"); Set(gblEditKey, ThisItem.Title); Set(gblEditUpdate, ThisItem); Reset(txtUpdText); Reset(drpUpdType); Reset(drpUpdRisk)

