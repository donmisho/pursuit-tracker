      Width: =110
      Height: =38
      Text: ="Add task"
      Font: =FontUI
      Size: =12
      Fill: =ClrCard
      Color: =ClrText
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
