      Text: |
        =If(
            gblNewPursuit,
            "Fill in the details panel and save to create it",
            PursuitLabel(
                gblPursuit.Title,
                Clip(
                    With(
                        { n: gblPursuit.'Pursuit Name' },
                        Trim(
                            If(
                                !IsBlank(Find(": ", n)),  Mid(n, Find(": ", n) + 2),
                                !IsBlank(Find(" - ", n)), Mid(n, Find(" - ", n) + 3),
                                n
                            )
                        )
                    ),
                    72
                )
            )
        )
      Font: =FontUI
      Size: =SizeCardTitle
      Color: =ClrTextMuted
      Wrap: =false
      VerticalAlign: =VerticalAlign.Middle

