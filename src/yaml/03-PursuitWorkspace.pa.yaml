      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      OnSelect: =Set(gblPanel, "")

- btnPanelSave:
    Control: Classic/Button
    Properties:
      X: =Parent.Width - 156
      Y: =Parent.Height - 76
      Width: =132
      Height: =40
      Visible: =gblPanel <> ""
      Text: ="Save"
      Font: =FontUI
      Size: =12
      Fill: =ClrAccent
      Color: =ClrAccentText
      HoverFill: =ClrAccentHover
      HoverColor: =ClrAccentText
      PressedFill: =ClrAccentHover
      PressedColor: =ClrAccentText
      BorderThickness: =0
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      DisplayMode: |
        =If(
            (gblPanel = "pursuit" && !IsBlank(txtPurAccount.Text) && !IsBlank(txtPurName.Text)) ||
            (gblPanel = "action"  && !IsBlank(txtActTitle.Text)) ||
            (gblPanel = "doc"     && !IsBlank(txtDocTitle.Text)) ||
            (gblPanel = "update"  && !IsBlank(txtUpdText.Text)),
            DisplayMode.Edit,
            DisplayMode.Disabled
        )
      OnSelect: |
        =If(
            gblPanel = "pursuit",
        
            Set(
                gblFields,
                {
                    'Account Name':               txtPurAccount.Text,
                    'Pursuit Name':               txtPurName.Text,
                    'Workflow Stage':             { Value: drpPurStage.Selected.Value },
                    Health:                       { Value: drpPurHealth.Selected.Value },
                    'WM Pursuit Owner Entra ID':  txtPurOwner.Text,
                    'Target Decision Date':       dtePurTarget.SelectedDate,
                    Active:                       If(IsBlank(txtPurActive.Text), 0, Value(txtPurActive.Text)),
                    'Salesforce Opportunity ID':  txtPurSfId.Text,
                    'Salesforce Opportunity URL': txtPurSfUrl.Text,
                    'Aligned SIs':                cmbPurSIs.SelectedItems,
                    Hyperscalers:                 cmbPurHype.SelectedItems,
                    'Estimated Fees':             If(IsBlank(txtPurFees.Text), Blank(), Value(txtPurFees.Text)),
                    'AI Overview Current Version': txtPurAiVer.Text
                }
            );
            If(
                gblNewPursuit,
                With(
                    { newId: "PUR-" & Text(Coalesce(Max(ForAll('pursuit-tracker-pursuits' As R, Value(Right(R.Title, 3))), Value), 0) + 1, "000") },
                    Collect('pursuit-tracker-pursuits', Patch(gblFields, { Title: newId }));
                    Set(gblPursuitKey, newId)
                ),
                Patch('pursuit-tracker-pursuits', LookUp('pursuit-tracker-pursuits', Title = gblPursuitKey), gblFields)
            );
            Set(gblNewPursuit, false);
            Set(gblPursuit, LookUp('pursuit-tracker-pursuits', Title = gblPursuitKey));
            ClearCollect(colActions, 'pursuit-tracker-actions'),
        
            gblPanel = "action",
        
            If(
                gblEditKey = "",
                Collect(
                    'pursuit-tracker-actions',
                    {
                        Title:                   "ACT-" & Text(Coalesce(Max(ForAll('pursuit-tracker-actions' As R, Value(Right(R.Title, 3))), Value), 0) + 1, "000"),
                        'Pursuit ID':            gblPursuitKey,
                        'Action Title':          txtActTitle.Text,
                        'Workflow Stage':        { Value: drpActStage.Selected.Value },
                        Status:                  { Value: drpActStatus.Selected.Value },
                        Health:                  { Value: drpActHealth.Selected.Value },
                        'Effort Size':           { Value: drpActEffort.Selected.Value },
                        'Due Date':              dteActDue.SelectedDate,
                        'Action Owner Entra ID': txtActOwner.Text,
                        'Predecessor Action ID': txtActPred.Text,
                        Notes:                   txtActNotes.Text,
                        'Completed Date':        If(drpActStatus.Selected.Value = "Completed", Now(), Blank())
                    }
                ),
                Patch(
                    'pursuit-tracker-actions',
                    LookUp('pursuit-tracker-actions', Title = gblEditKey),
                    {
                        'Action Title':          txtActTitle.Text,
                        'Workflow Stage':        { Value: drpActStage.Selected.Value },
                        Status:                  { Value: drpActStatus.Selected.Value },
                        Health:                  { Value: drpActHealth.Selected.Value },
                        'Effort Size':           { Value: drpActEffort.Selected.Value },
                        'Due Date':              dteActDue.SelectedDate,
                        'Action Owner Entra ID': txtActOwner.Text,
                        'Predecessor Action ID': txtActPred.Text,
                        Notes:                   txtActNotes.Text,
                        'Completed Date':        If(drpActStatus.Selected.Value = "Completed", Coalesce(gblEditAction.'Completed Date', Now()), Blank())
                    }
                )
            );
            ClearCollect(colActions, 'pursuit-tracker-actions');
        ClearCollect(
            colActions_P,
            AddColumns(
                Sort(Filter('pursuit-tracker-actions', 'Pursuit ID' = gblPursuitKey), If(IsBlank('Due Date'), Date(2099, 12, 31), 'Due Date'), SortOrder.Ascending) As A,
                DueWording,
                If(!IsBlank(A.'Due Date') || IsBlank(A.'Predecessor Action ID'), "",
                   "After " & Lower(LookUp('pursuit-tracker-actions', Title = A.'Predecessor Action ID').'Workflow Stage'.Value))
            )
        ),
        
            gblPanel = "doc",
        
            If(
                gblEditKey = "",
                Collect(
                    'pursuit-tracker-documents',
                    {
                        Title:                    txtDocTitle.Text,
                        'Document ID':            "DOC-" & Text(Coalesce(Max(ForAll('pursuit-tracker-documents' As R, Value(Right(R.'Document ID', 3))), Value), 0) + 1, "000"),
                        'Pursuit ID':             gblPursuitKey,
                        'Document Type':          { Value: drpDocType.Selected.Value },
                        'Document URL':           txtDocUrl.Text,
                        'Added Date':             Now(),
                        'Added By Entra ID':      gblUser.Email,
                        'Include in AI Overview': { Value: drpDocInc.Selected.Value }
                    }
                ),
                Patch(
                    'pursuit-tracker-documents',
                    LookUp('pursuit-tracker-documents', Title = gblEditKey),
                    {
                        Title:                    txtDocTitle.Text,
                        'Document Type':          { Value: drpDocType.Selected.Value },
                        'Document URL':           txtDocUrl.Text,
                        'Include in AI Overview': { Value: drpDocInc.Selected.Value }
                    }
                )
            );
            ClearCollect(colDocs, Sort(Filter('pursuit-tracker-documents', 'Pursuit ID' = gblPursuitKey), 'Added Date', SortOrder.Descending)),
        
            If(
                gblEditKey = "",
                Collect(
                    'pursuit-tracker-status-updates',
                    {
                        Title:                 "UPD-" & Text(Coalesce(Max(ForAll('pursuit-tracker-status-updates' As R, Value(Right(R.Title, 3))), Value), 0) + 1, "000"),
                        'Pursuit ID':          gblPursuitKey,
                        'Update Date':         Now(),
                        'Update Type':         { Value: drpUpdType.Selected.Value },
                        'Update Text':         txtUpdText.Text,
                        'Risk / Decision':     { Value: drpUpdRisk.Selected.Value },
                        'Created By Entra ID': gblUser.Email
                    }
                ),
                Patch(
                    'pursuit-tracker-status-updates',
                    LookUp('pursuit-tracker-status-updates', Title = gblEditKey),
                    {
                        'Update Type':     { Value: drpUpdType.Selected.Value },
                        'Update Text':     txtUpdText.Text,
                        'Risk / Decision': { Value: drpUpdRisk.Selected.Value }
                    }
                )
            );
            ClearCollect(colUpdates, Sort(Filter('pursuit-tracker-status-updates', 'Pursuit ID' = gblPursuitKey), 'Update Date', SortOrder.Descending))
        );
        Set(gblPanel, "")

