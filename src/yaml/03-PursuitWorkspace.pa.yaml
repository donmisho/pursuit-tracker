    Properties:
      Text: =""
      Fill: =ClrCard
      HoverFill: =ClrCard
      PressedFill: =ClrCard
      OnSelect: =false
      X: =688
      Y: =448
      Width: =Parent.Width - 688 - GapPage
      Height: =160
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =RadiusCard
      RadiusTopRight: =RadiusCard
      RadiusBottomLeft: =RadiusCard
      RadiusBottomRight: =RadiusCard

- lblUpdatesHead:
    Control: Label
    Properties:
      X: =708
      Y: =458
      Width: =400
      Height: =24
      Text: ="Status updates"
      Font: =FontUI
      Size: =SizeCardTitle
      FontWeight: =FontWeight.Semibold
      Color: =ClrText

- btnAddUpdate:
    Control: Classic/Button
    Properties:
      X: =Parent.Width - GapPage - 64
      Y: =458
      Width: =64
      Height: =26
      Text: ="+ Add"
      Font: =FontUI
      Size: =11
      Fill: =ClrColumn
      Color: =ClrText
      HoverFill: =ClrCardHover
      HoverColor: =ClrText
      PressedFill: =ClrCardHover
      PressedColor: =ClrText
      BorderColor: =ClrBorder
      BorderThickness: =1
      RadiusTopLeft: =4
      RadiusTopRight: =4
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
      DisplayMode: =If(gblNewPursuit, DisplayMode.Disabled, DisplayMode.Edit)
      OnSelect: =Set(gblPanel, "update"); Set(gblEditKey, ""); Set(gblEditUpdate, LookUp('pursuit-tracker-status-updates', ID < 0)); Reset(txtUpdText); Reset(drpUpdType); Reset(drpUpdRisk)

- galUpdates:
    Control: Gallery
    Variant: Vertical
    Properties:
      X: =708
      Y: =486
      Width: =Parent.Width - 708 - GapPage
      Height: =112
      Items: =colUpdates
      TemplateSize: =84
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblUpdateBody:
          Control: Label
          Properties:
            X: =0
            Y: =4
            Width: =Parent.Width - 200
            Height: =42
            Text: =Clip(ThisItem.'Update Text', 128)
            Font: =FontUI
            Size: =SizeBody
            Color: =ClrText
            Wrap: =true
            VerticalAlign: =VerticalAlign.Top

      - recUpdateTag:
          Control: Classic/Button
          Properties:
            Text: =""
            Fill: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskFill, ClrChip)
            HoverFill: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskFill, ClrChip)
            PressedFill: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskFill, ClrChip)
            OnSelect: =false
            X: =Parent.Width - 186
            Y: =4
            Width: =76
            Height: =22
            Visible: =Not(IsBlank(ThisItem.'Risk / Decision'.Value))
            RadiusTopLeft: =RadiusChip
            RadiusTopRight: =RadiusChip
            RadiusBottomLeft: =RadiusChip
            RadiusBottomRight: =RadiusChip

      - lblUpdateTag:
          Control: Label
          Properties:
            X: =Parent.Width - 186
            Y: =4
            Width: =76
            Height: =22
            Visible: =recUpdateTag.Visible
            Text: =ThisItem.'Risk / Decision'.Value
            Font: =FontUI
            Size: =SizeChip
            Color: =If(ThisItem.'Risk / Decision'.Value = "Risk", ClrRiskText, ClrChipText)
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

      - lblUpdateMeta:
          Control: Label
          Properties:
            X: =0
            Y: =50
            Width: =Parent.Width - 120
            Height: =18
            Text: |
              =RelativeDay(ThisItem.'Update Date') &
               " · " & Lower(ThisItem.'Update Type'.Value) &
               " · " & Coalesce(LookUp(colPeople, Email = ThisItem.'Created By Entra ID').Name, ThisItem.'Created By Entra ID')
            Font: =FontUI
            Size: =SizeMeta
            Color: =ClrTextFaint

      - btnUpdateEdit:
          Control: Classic/Button
          Properties:
            X: =Parent.Width - 90
            Y: =48
            Width: =64
            Height: =26
            Text: ="Edit"
            Font: =FontUI
            Size: =11
            Fill: =Color.Transparent
            Color: =ClrTextMuted
            HoverFill: =ClrCardHover
            HoverColor: =ClrText
            PressedFill: =ClrCardHover
            PressedColor: =ClrText
            BorderColor: =ClrBorder
            BorderThickness: =1
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            OnSelect: =Set(gblPanel, "update"); Set(gblEditKey, ThisItem.Title); Set(gblEditUpdate, ThisItem); Reset(txtUpdText); Reset(drpUpdType); Reset(drpUpdRisk)

      - recUpdateDivider:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.Width - 20
            Height: =1
            Fill: =ClrDivider

